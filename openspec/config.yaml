schema: spec-driven

context: |
  Follow AGENTS.md as the authoritative source for project-wide engineering principles and conventions.

  Before making design or implementation decisions:
  - Inspect the existing code, tests, documentation, and established project patterns.
  - Prefer existing project conventions and dependencies over introducing new abstractions or packages.
  - Keep changes minimal and focused on the requested scope.
  - Do not perform unrelated refactoring or speculative improvements.

rules:
  proposal:
    - Keep each change focused on one coherent problem.
    - Explicitly state important non-goals to prevent scope creep.
    - Surface assumptions or unresolved decisions that could affect behavior, scope, or architecture instead of silently carrying them forward.

  specs:
    - Describe observable product or system behavior, not implementation details.
    - Cover the main success path and behaviorally significant error or edge cases.
    - Do not prescribe libraries, internal APIs, class names, or implementation mechanisms unless they are part of the external contract.

  design:
    - Base technical decisions on evidence from the existing codebase and established project patterns.
    - Prefer the simplest design that fully satisfies the specs.
    - Prefer existing dependencies and capabilities before adding new packages or abstractions.
    - Document the rationale and meaningful rejected alternatives for significant technical decisions.
    - Resolve any open question that would change the specs, architecture, or task breakdown before creating implementation tasks.
    - Keep components modular with clear responsibilities and boundaries.

  tasks:
    - Each task must represent one coherent, independently verifiable deliverable.
    - Include a concrete verification method or command for each task.
    - For behavior changes, include the required test work before implementation work when practical.
    - Order tasks so dependencies are explicit and each completed task leaves the system in a valid state.
    - Do not include speculative infrastructure, unrelated refactoring, or work outside the approved change.

operations:
  apply:
    guidance:
      - Before modifying code, use Superpowers using-git-worktrees when an isolated workspace is not already active.
      - Keep implementation aligned with the current specs, design, and tasks.
      - If implementation reveals that an artifact is incorrect or incomplete, update the artifact before continuing instead of silently deviating from it.
      - Use Superpowers test-driven-development for behavior changes when applicable.
      - Use Superpowers systematic-debugging for test failures, bugs, build failures, or unexpected behavior.
      - Do not mark a task complete until its stated verification has passed with fresh evidence.
      - Do not silently absorb new scope discovered during implementation; surface it and update the change artifacts first.
      - After implementation, use Superpowers requesting-code-review when available and resolve important findings.
      - Use Superpowers verification-before-completion before claiming the implementation is complete.

  archive:
    guidance:
      - Archive only after implementation and required project verification are complete.
      - Do not archive while known spec, design, or implementation drift remains unresolved.
      - Do not archive changes with intentionally incomplete tasks unless the user explicitly chooses to do so.
